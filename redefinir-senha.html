<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>Redefinir senha | Semanário</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#eadfc6;color:#2e2a23;font:16px/1.5 system-ui,sans-serif}
main{width:100%;max-width:430px}img{width:200px;height:auto}h1{font-size:30px}form,label{display:grid;gap:8px}form{gap:18px}input,button{min-height:48px;border-radius:6px;padding:10px 12px;font:inherit}input{border:1px solid #9d937e;background:#fff}button{border:0;background:#0089a8;color:#fff;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}a{color:#00677f}#message{white-space:pre-wrap} [hidden]{display:none!important}
</style><script defer src="js/password-recovery.js"></script></head><body><main>
<img src="assets/logo.png?v=2" alt="Colégio Gênesis Life">
<h1 id="title">Recuperar senha</h1><p id="intro">Informe seu e-mail para receber um link de redefinição.</p>
<p id="message" role="status" aria-live="polite"></p>
<form id="request-form"><label>E-mail<input name="email" type="email" autocomplete="email" required></label><button>Enviar link de recuperação</button></form>
<form id="reset-form" hidden><label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="8" required></label><label>Confirmar nova senha<input name="confirmation" type="password" autocomplete="new-password" minlength="8" required></label><small>Use pelo menos 8 caracteres.</small><button>Salvar nova senha</button></form>
<p><a href="/">Voltar ao login</a></p></main></body></html>
